<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>❤️ 520快乐 ❤️</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  overflow: hidden;
  background: #0a0010;
  font-family: 'Georgia', 'PingFang SC', serif;
  cursor: default;
  height: 100vh;
  width: 100vw;
  user-select: none;
}

canvas {
  pointer-events: none !important;
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* ========== 封面 ========== */
#cover {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a0015 0%, #0a0010 60%, #050008 100%);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
#cover.hidden {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

/* 封面背景装饰粒子 */
.cover-particles {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.cover-particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 107, 157, 0.4);
  animation: float-particle linear infinite;
}
@keyframes float-particle {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* 封面内容 (置于粒子之上) */
.cover-content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 20px;
}

/* 大爱心 */
.cover-heart {
  font-size: 80px;
  display: block;
  margin-bottom: 10px;
  animation: heart-beat 1.5s ease-in-out infinite;
  filter: drop-shadow(0 0 40px rgba(255, 45, 85, 0.4));
}
@keyframes heart-beat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.15); }
  30% { transform: scale(1); }
  45% { transform: scale(1.1); }
  60% { transform: scale(1); }
}

/* 主页面 - 大心形照片 */
.main-photo {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 360px;
  height: 360px;
  z-index: 3;
  filter: drop-shadow(0 0 40px rgba(255, 45, 85, 0.35)) drop-shadow(0 0 80px rgba(255, 107, 157, 0.15));
  opacity: 0;
  transition: opacity 1s ease, transform 1s ease;
  pointer-events: none;
}
.main-photo.visible {
  opacity: 1;
  transform: translate(-50%, -55%) scale(1);
}
.main-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  clip-path: url(#heartClip);
}
.main-photo .glow-ring {
  position: absolute;
  top: -4px;
  left: -4px;
  right: -4px;
  bottom: -4px;
  clip-path: url(#heartClip);
  border: 3px solid rgba(255, 107, 157, 0.4);
  pointer-events: none;
  animation: ring-pulse 2.5s ease-in-out infinite;
}
@keyframes ring-pulse {
  0%, 100% { border-color: rgba(255, 107, 157, 0.3); }
  50% { border-color: rgba(255, 107, 157, 0.7); }
}

/* 520 大字 */
.cover-520 {
  font-size: 80px;
  font-weight: bold;
  background: linear-gradient(135deg, #ff6b9d, #ff2d55, #ff9a9e, #ff6b9d);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s ease infinite;
  letter-spacing: 12px;
  line-height: 1.2;
  text-shadow: none;
}
@keyframes shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* 副标题 */
.cover-sub {
  color: rgba(255, 200, 220, 0.6);
  font-size: 20px;
  letter-spacing: 6px;
  margin-top: 12px;
  font-weight: normal;
}
.cover-sub-line {
  color: rgba(255, 200, 220, 0.35);
  font-size: 14px;
  letter-spacing: 4px;
  margin-top: 6px;
}

/* 装饰线条 */
.cover-decoration {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 28px 0;
}
.cover-decoration .line {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 107, 157, 0.5), transparent);
}
.cover-decoration .diamond {
  color: rgba(255, 107, 157, 0.5);
  font-size: 12px;
}

/* 进入按钮 */
#enterBtn {
  position: relative;
  z-index: 2;
  background: linear-gradient(135deg, rgba(255, 45, 85, 0.2), rgba(255, 107, 157, 0.2));
  border: 1.5px solid rgba(255, 107, 157, 0.5);
  color: #ff8aae;
  font-size: 18px;
  letter-spacing: 4px;
  padding: 14px 50px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.4s ease;
  font-family: inherit;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 0 30px rgba(255, 107, 157, 0.15), inset 0 0 20px rgba(255, 107, 157, 0.05);
  outline: none;
  -webkit-tap-highlight-color: transparent;
  animation: btn-glow 2s ease-in-out infinite;
}
@keyframes btn-glow {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 107, 157, 0.15), inset 0 0 20px rgba(255, 107, 157, 0.05); }
  50% { box-shadow: 0 0 50px rgba(255, 107, 157, 0.3), inset 0 0 30px rgba(255, 107, 157, 0.1); }
}
#enterBtn:hover {
  background: linear-gradient(135deg, rgba(255, 45, 85, 0.3), rgba(255, 107, 157, 0.3));
  border-color: rgba(255, 107, 157, 0.8);
  transform: scale(1.05);
  box-shadow: 0 0 60px rgba(255, 107, 157, 0.4);
}
#enterBtn:active {
  transform: scale(0.97);
}

/* 底部提示 */
.cover-footer {
  position: relative;
  z-index: 1;
  margin-top: 40px;
  color: rgba(255, 200, 220, 0.2);
  font-size: 12px;
  letter-spacing: 2px;
  animation: footer-pulse 2s ease-in-out infinite;
}
@keyframes footer-pulse {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.5; }
}

/* ========== 主页面 (隐藏) ========== */
#main {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.8s ease;
}
#main.visible {
  opacity: 1;
}

/* 顶部标题 */
.title {
  position: fixed;
  top: 30px;
  left: 0;
  width: 100%;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}
.title h1 {
  font-size: 36px;
  background: linear-gradient(135deg, #ff6b9d, #ff2d55, #ff9a9e, #ff6b9d);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s ease infinite;
  letter-spacing: 8px;
  font-weight: bold;
}
.title .sub {
  font-size: 16px;
  color: rgba(255, 200, 220, 0.5);
  margin-top: 8px;
  letter-spacing: 3px;
  -webkit-text-fill-color: rgba(255, 200, 220, 0.5);
}

/* 音乐按钮 */
.music-btn {
  position: fixed;
  top: 90px;
  right: 20px;
  z-index: 20;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(255, 107, 157, 0.5);
  background: rgba(10, 0, 16, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #ff6b9d;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 0 25px rgba(255, 107, 157, 0.15);
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.music-btn:hover {
  border-color: #ff6b9d;
  box-shadow: 0 0 35px rgba(255, 107, 157, 0.35);
  transform: scale(1.08);
}
.music-btn:active {
  transform: scale(0.95);
}
.music-btn.playing {
  box-shadow: 0 0 35px rgba(255, 107, 157, 0.4), inset 0 0 25px rgba(255, 107, 157, 0.15);
  border-color: #ff8aae;
}
.music-btn-label {
  position: fixed;
  top: 142px;
  right: 14px;
  z-index: 20;
  color: rgba(255, 200, 220, 0.4);
  font-size: 11px;
  letter-spacing: 1px;
  pointer-events: none;
  text-align: center;
}
.music-btn .note-icon {
  transition: transform 0.3s ease;
}
.music-btn.playing .note-icon {
  animation: spin 3s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* 底部浪漫文字 */
.message-container {
  position: fixed;
  bottom: 50px;
  left: 0;
  width: 100%;
  z-index: 10;
  pointer-events: none;
  text-align: center;
  padding: 0 20px;
}
.message {
  display: inline-block;
  color: rgba(255, 210, 225, 0.95);
  font-size: 22px;
  letter-spacing: 3px;
  line-height: 1.8;
  text-shadow: 0 0 30px rgba(255, 107, 157, 0.4), 0 0 60px rgba(255, 45, 85, 0.2);
  border-right: 2.5px solid #ff6b9d;
  white-space: nowrap;
  overflow: hidden;
  font-weight: bold;
}
@keyframes blink {
  50% { border-color: transparent; }
}

/* 提示 */
.hint {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: rgba(255, 200, 220, 0.35);
  font-size: 14px;
  letter-spacing: 2px;
  animation: pulse-hint 2s ease-in-out infinite;
  pointer-events: none;
  white-space: nowrap;
}
@keyframes pulse-hint {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.8; }
}

/* 浮动爱心容器 */
.floating-hearts {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}
.float-heart {
  position: absolute;
  font-size: 20px;
  opacity: 0;
}

/* 响应式 */
@media (max-width: 600px) {
  .cover-520 { font-size: 56px; letter-spacing: 8px; }
  .cover-heart { font-size: 60px; }
  .cover-sub { font-size: 16px; letter-spacing: 4px; }
  .main-photo { width: 220px; height: 220px; }
  #enterBtn { font-size: 16px; padding: 12px 36px; }
  .message { font-size: 16px; white-space: normal; }
  .title h1 { font-size: 24px; letter-spacing: 4px; }
  .title .sub { font-size: 13px; }
  .music-btn { top: 80px; right: 14px; width: 42px; height: 42px; font-size: 18px; }
  .music-btn-label { top: 126px; right: 8px; font-size: 10px; }
}
</style>
</head>
<body>

<!-- ====== 封面 ====== -->
<div id="cover">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <clipPath id="heartClip">
        <path d="M50,30 C50,20 35,12 22,25 C10,38 10,55 28,72 L50,92 L72,72 C90,55 90,38 78,25 C65,12 50,20 50,30Z"/>
      </clipPath>
    </defs>
  </svg>
  <div class="cover-particles" id="coverParticles"></div>
  <div class="cover-content">
    <span class="cover-heart">💕</span>
    <div class="cover-520">520</div>
    <div class="cover-sub">写给我最爱的妹妹</div>
    <div class="cover-sub-line">— 一份小小的惊喜 —</div>
    <div class="cover-decoration">
      <span class="line"></span>
      <span class="diamond">◇</span>
      <span class="line"></span>
    </div>
    <button id="enterBtn">💫 点击进入 💫</button>
  </div>
  <div class="cover-footer">— 点击按钮，开启浪漫之旅 —</div>
</div>

<!-- ====== 主页面 ====== -->
<div id="main">
  <div class="title">
    <h1>✨ 520 ✨</h1>
    <div class="sub">— 写给我最爱的妹妹 —</div>
  </div>

  <button class="music-btn" id="musicBtn" title="播放/暂停音乐">
    <span class="note-icon">🎵</span>
  </button>
  <div class="music-btn-label">音乐</div>

  <div class="main-photo" id="mainPhoto">
    <img src="photo.jpeg" alt="合照">
    <div class="glow-ring"></div>
  </div>

  <div class="message-container">
    <div class="message" id="typewriter"></div>
  </div>

  <div class="hint" id="hint">💫 点击屏幕放烟花 💫</div>

  <div class="floating-hearts" id="heartsContainer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// 0. 封面粒子背景
// ============================================================
(function() {
  const container = document.getElementById('coverParticles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'cover-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = (2 + Math.random() * 4) + 'px';
    p.style.height = p.style.width;
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    p.style.opacity = 0.2 + Math.random() * 0.4;
    container.appendChild(p);
  }
})();

// ============================================================
// 1. 3D 爱心粒子 (Three.js)
// ============================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.domElement.style.pointerEvents = 'none';
document.body.prepend(renderer.domElement);

const heartParticles = new THREE.BufferGeometry();
const count = 4000;
const positions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);
const sizes = new Float32Array(count);

for (let i = 0; i < count; i++) {
  const t = Math.random() * Math.PI * 2;
  const scale = 0.25 + Math.random() * 0.08;
  const x = 16 * Math.pow(Math.sin(t), 3) * scale;
  const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
  const z = (Math.random() - 0.5) * 3;
  const spread = 0.3;
  positions[i*3] = x + (Math.random() - 0.5) * spread;
  positions[i*3+1] = y + (Math.random() - 0.5) * spread;
  positions[i*3+2] = z + (Math.random() - 0.5) * spread;
  const mix = Math.random();
  if (mix < 0.33) {
    colors[i*3] = 1.0; colors[i*3+1] = 0.2; colors[i*3+2] = 0.4;
  } else if (mix < 0.66) {
    colors[i*3] = 1.0; colors[i*3+1] = 0.4; colors[i*3+2] = 0.6;
  } else {
    colors[i*3] = 1.0; colors[i*3+1] = 0.6; colors[i*3+2] = 0.8;
  }
  sizes[i] = 0.03 + Math.random() * 0.06;
}
heartParticles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
heartParticles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
heartParticles.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const heartMaterial = new THREE.PointsMaterial({
  size: 0.06,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
  depthWrite: false,
});
const heart = new THREE.Points(heartParticles, heartMaterial);
scene.add(heart);

// 外围光晕粒子
const glowCount = 1500;
const glowPositions = new Float32Array(glowCount * 3);
const glowColors = new Float32Array(glowCount * 3);
for (let i = 0; i < glowCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 2 + Math.random() * 3;
  const t = Math.random() * Math.PI * 2;
  const scale = 0.3;
  const hx = 16 * Math.pow(Math.sin(t), 3) * scale;
  const hy = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
  glowPositions[i*3] = hx + Math.cos(angle) * radius * (0.5 + Math.random() * 0.5);
  glowPositions[i*3+1] = hy + Math.sin(angle) * radius * (0.5 + Math.random() * 0.5);
  glowPositions[i*3+2] = (Math.random() - 0.5) * 4;
  const bright = 0.3 + Math.random() * 0.4;
  glowColors[i*3] = 1.0;
  glowColors[i*3+1] = bright * 0.6;
  glowColors[i*3+2] = bright * 0.8;
}
const glowGeometry = new THREE.BufferGeometry();
glowGeometry.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
glowGeometry.setAttribute('color', new THREE.BufferAttribute(glowColors, 3));
const glowMaterial = new THREE.PointsMaterial({
  size: 0.04,
  vertexColors: true,
  transparent: true,
  opacity: 0.3,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
  depthWrite: false,
});
const glowParticles = new THREE.Points(glowGeometry, glowMaterial);
scene.add(glowParticles);
camera.position.z = 6;

// 背景星空
const starCount = 800;
const starGeometry = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i*3] = (Math.random() - 0.5) * 30;
  starPos[i*3+1] = (Math.random() - 0.5) * 30;
  starPos[i*3+2] = (Math.random() - 0.5) * 30 - 10;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMaterial = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 0.04,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
});
const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

// ============================================================
// 2. 鼠标控制
// ============================================================
let mouseX = 0, mouseY = 0;
let targetRotX = 0, targetRotY = 0;
document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});
document.addEventListener('touchmove', (e) => {
  const touch = e.touches[0];
  mouseX = (touch.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (touch.clientY / window.innerHeight - 0.5) * 2;
}, { passive: true });

// ============================================================
// 3. 动画循环
// ============================================================
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.005;
  targetRotX += (mouseY * 0.3 - targetRotX) * 0.03;
  targetRotY += (mouseX * 0.3 - targetRotY) * 0.03;
  heart.rotation.x = targetRotX;
  heart.rotation.y = targetRotY + time * 0.3;
  glowParticles.rotation.x = targetRotX;
  glowParticles.rotation.y = targetRotY + time * 0.3;
  const breathe = 1 + Math.sin(time * 1.5) * 0.03;
  heart.scale.set(breathe, breathe, breathe);
  stars.rotation.y += 0.0003;
  stars.rotation.x += 0.0001;
  glowParticles.rotation.z += 0.002;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// 4. 封面进入 + 音乐自动播放
// ============================================================
const cover = document.getElementById('cover');
const main = document.getElementById('main');
const enterBtn = document.getElementById('enterBtn');
let entered = false;

// 音乐
let audioElement = null;
let isMusicPlaying = false;
let audioCtx = null;
let synthNodes = [];
let synthMasterGain = null;
let synthPlaying = false;
let useSynthesizer = false;

const MUSIC_URL = 'bgmusic.mp3';

function initAudio() {
  if (audioElement) return;
  audioElement = new Audio();
  audioElement.loop = true;
  audioElement.volume = 0.5;
  audioElement.src = MUSIC_URL;
  audioElement.addEventListener('canplaythrough', () => { useSynthesizer = false; });
  audioElement.addEventListener('error', () => {
    if (!useSynthesizer) { useSynthesizer = true; audioElement = null; }
  });
}

function playOnlineMusic() {
  if (!audioElement) initAudio();
  if (!audioElement) return false;
  audioElement.currentTime = 0;
  audioElement.play().then(() => {
    isMusicPlaying = true;
    updateMusicUI();
  }).catch(() => {
    useSynthesizer = true;
    audioElement = null;
    startSynthesizer();
  });
  return true;
}

// 合成器 (备用)
const NOTE_FREQ = {
  C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,
};
const SONG_CHORDS = [
  { root:'C3', notes:['C4','E4','G4','B4','D5'] },
  { root:'B3', notes:['B3','D4','F4','A4','G5'] },
  { root:'A3', notes:['A3','C4','E4','G4','B4'] },
  { root:'F3', notes:['F3','A3','C4','E4','G4'] },
];
const SONG_BPM = 78;
const SONG_BEAT = 60000 / SONG_BPM;

function getFreq(n) { return NOTE_FREQ[n] || 261.63; }

function createReverb(ctx, duration) {
  const sr = ctx.sampleRate, len = sr * duration;
  const impulse = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = impulse.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/sr*2.5);
  }
  const c = ctx.createConvolver(); c.buffer = impulse; return c;
}

function startSynthesizer() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (synthPlaying) return;
  synthPlaying = true;
  synthMasterGain = audioCtx.createGain();
  synthMasterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  synthMasterGain.connect(audioCtx.destination);
  const reverb = createReverb(audioCtx, 2.5);
  const reverbGain = audioCtx.createGain();
  reverbGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  synthMasterGain.connect(reverbGain); reverbGain.connect(reverb); reverb.connect(audioCtx.destination);
  function scheduleLoop() {
    if (!synthPlaying) return;
    const now = audioCtx.currentTime, barLen = SONG_BEAT*4/1000, loopLen = SONG_CHORDS.length*barLen;
    for (let c = 0; c < SONG_CHORDS.length; c++) {
      const chord = SONG_CHORDS[c], barStart = now + c*barLen;
      const bass = audioCtx.createOscillator(), bassG = audioCtx.createGain();
      bass.type='sine'; bass.frequency.setValueAtTime(getFreq(chord.root),barStart);
      bassG.gain.setValueAtTime(0,barStart); bassG.gain.linearRampToValueAtTime(0.12,barStart+0.05);
      bassG.gain.setValueAtTime(0.12,barStart+barLen-0.1); bassG.gain.linearRampToValueAtTime(0,barStart+barLen);
      bass.connect(bassG); bassG.connect(synthMasterGain); bass.start(barStart); bass.stop(barStart+barLen+0.05);
      const arpNotes = chord.notes;
      for (let n = 0; n < arpNotes.length; n++) {
        const t = barStart+n*(barLen/arpNotes.length);
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.type='triangle'; o.frequency.setValueAtTime(getFreq(arpNotes[n]),t);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.08,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,t+barLen*0.35);
        o.connect(g); g.connect(reverbGain); o.start(t); o.stop(t+barLen*0.4);
      }
      for (let n = arpNotes.length-2; n > 0; n--) {
        const t = barStart+(arpNotes.length-1-n+arpNotes.length)*(barLen/(arpNotes.length*2));
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.type='triangle'; o.frequency.setValueAtTime(getFreq(arpNotes[n]),t);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.06,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,t+barLen*0.3);
        o.connect(g); g.connect(reverbGain); o.start(t); o.stop(t+barLen*0.35);
      }
      for (const nName of chord.notes.slice(0,4)) {
        const t = barStart, freq = getFreq(nName)*0.5, dur = barLen*0.9;
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.type='sawtooth'; o.frequency.setValueAtTime(freq,t);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.03,t+0.3);
        g.gain.setValueAtTime(0.03,t+dur-0.3); g.gain.linearRampToValueAtTime(0,t+dur);
        o.connect(g); g.connect(synthMasterGain); o.start(t); o.stop(t+dur+0.05);
      }
      const melodyNotes = [
        {note:chord.notes[2],time:0,dur:1},{note:chord.notes[1],time:1,dur:0.5},
        {note:chord.notes[3],time:1.5,dur:0.5},{note:chord.notes[2],time:2,dur:1},
        {note:chord.notes[0],time:3,dur:1},
      ];
      for (const m of melodyNotes) {
        const t = barStart+m.time*SONG_BEAT/1000, dur = m.dur*SONG_BEAT/1000, freq = getFreq(m.note)*2;
        for (let l = 0; l < 2; l++) {
          const o=audioCtx.createOscillator(), g=audioCtx.createGain();
          o.type=l===0?'sine':'triangle'; o.frequency.setValueAtTime(l===1?freq*1.003:freq,t);
          g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(l===0?0.07:0.04,t+0.03);
          g.gain.exponentialRampToValueAtTime(0.001,t+dur*0.7);
          o.connect(g); g.connect(reverbGain); o.start(t); o.stop(t+dur*0.8);
        }
      }
    }
    synthLoopTO = setTimeout(scheduleLoop, (loopLen-0.1)*1000);
  }
  let synthLoopTO = setTimeout(scheduleLoop, 200);
  synthNodes.push({timeout: synthLoopTO});
}

function stopSynthesizer() {
  synthPlaying = false;
  synthNodes.forEach(n => { if(n.timeout) clearTimeout(n.timeout); });
  synthNodes = [];
  if (synthMasterGain) {
    try { synthMasterGain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime+0.3); } catch(e){}
    setTimeout(() => { if(synthMasterGain && !synthPlaying) { try{synthMasterGain.disconnect()}catch(e){} synthMasterGain=null; } }, 500);
  }
}

function startMusic() {
  initAudio();
  if (useSynthesizer) { startSynthesizer(); isMusicPlaying = true; }
  else { playOnlineMusic(); }
  updateMusicUI();
}

function stopMusic() {
  if (useSynthesizer) stopSynthesizer();
  else if (audioElement) { audioElement.pause(); }
  isMusicPlaying = false;
  updateMusicUI();
}

function updateMusicUI() {
  const icon = document.querySelector('#musicBtn .note-icon');
  if (isMusicPlaying) { icon.textContent = '🔊'; document.getElementById('musicBtn').classList.add('playing'); }
  else { icon.textContent = '🎵'; document.getElementById('musicBtn').classList.remove('playing'); }
}

document.getElementById('musicBtn').addEventListener('click', () => {
  if (isMusicPlaying) stopMusic();
  else startMusic();
});

// 进入按钮点击
enterBtn.addEventListener('click', function(e) {

  }, 100);

  setTimeout(() => {
    document.getElementById('mainPhoto').classList.add('visible');
  }, 600);

  // 封面移除 (避免挡住交互)
  setTimeout(() => {
    cover.style.display = 'none';
  }, 900);

  // 自动放烟花
  setTimeout(() => {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight * 0.4;
    const evt = new MouseEvent('click', { clientX: cx, clientY: cy });
    document.dispatchEvent(evt);
  }, 1200);
});

// 5. 打字机效果
// ============================================================
const words = [
  '妹妹，520快乐 💕',
  '和你在一起的每一天，都是最美的时光 🌹',
  '一起加油，创造属于我们的未来 ✨',
  '你的笑容是我前进的动力 ☀️',
  '不离不弃，携手同行 🌺',
  '520，我爱你 ❤️',
];
const el = document.getElementById('typewriter');
let wordIndex = 0, charIndex = 0, isDeleting = false;

function typeEffect() {
  const current = words[wordIndex];
  if (!isDeleting) {
    el.textContent = current.substring(0, charIndex+1);
    el.style.animation = 'blink 0.8s step-end infinite';
    charIndex++;
    if (charIndex === current.length) {
      setTimeout(() => { isDeleting = true; }, 3000);
      setTimeout(typeEffect, 3000); return;
    }
    setTimeout(typeEffect, 60+Math.random()*80);
  } else {
    el.textContent = current.substring(0, charIndex-1);
    el.style.animation = 'blink 0.8s step-end infinite';
    charIndex--;
    if (charIndex === 0) { isDeleting = false; wordIndex = (wordIndex+1)%words.length; setTimeout(typeEffect,500); return; }
    setTimeout(typeEffect, 30+Math.random()*40);
  }
}
typeEffect();

// ============================================================
// 6. 点击烟花
// ============================================================
document.addEventListener('click', (e) => {
  // 如果还在封面上则忽略
  if (!entered || cover.style.display !== 'none') return;

  const container = document.getElementById('heartsContainer');
  const emojis = ['❤️','💕','💗','💖','✨','🌸','🌹','💫','⭐','🥰','💝','🎀','🌟'];
  const count = 40 + Math.floor(Math.random() * 30);
  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'float-heart';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const cx = e.clientX || window.innerWidth/2;
    const cy = e.clientY || window.innerHeight/2;
    h.style.left = cx + 'px';
    h.style.top = cy + 'px';
    const angle = Math.random()*Math.PI*2;
    const dist = 100 + Math.random() * 550;
    const tx = Math.cos(angle)*dist;
    const ty = Math.sin(angle)*dist - 120;
    const rot = Math.random()*1080;
    const scale = 0.3+Math.random()*0.9;
    h.style.fontSize = (22+Math.random()*40)+'px';
    h.style.opacity = '1';
    h.style.transitionDelay = (Math.random()*0.15)+'s';
    container.appendChild(h);
    requestAnimationFrame(() => {
      h.style.transition = 'all 3.2s cubic-bezier(0.15,0.6,0.35,1)';
      h.style.transform = `translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${scale})`;
      h.style.opacity = '0';
    });
    setTimeout(() => h.remove(), 4000);
  }
  const hint = document.getElementById('hint');
  hint.style.transition = 'opacity 1s';
  hint.style.opacity = '0';
});

// 自动烟花 (进入后才生效)
setInterval(() => {
  if (!entered || cover.style.display !== 'none') return;
  const cx = 80+Math.random()*(window.innerWidth-160);
  const cy = 80+Math.random()*(window.innerHeight-300);
  document.dispatchEvent(new MouseEvent('click', { clientX: cx, clientY: cy }));
}, 15000);
